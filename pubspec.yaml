# Internal package id is deliberately kept as `pantry_pilot` so already-
# installed builds upgrade in place (same Android applicationId) and keep their
# saved recipes. The user-facing name is Recipe Pilot everywhere.
name: pantry_pilot
description: Recipe Pilot — offline-first recipe library and Recipe → Grocery List converter.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Offline-first local storage. Pure-Dart core, tiny footprint, no codegen
  # needed here (we persist plain maps, so there are no TypeAdapters).
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Writes the Android launcher icons from assets/icon/* — run by CI after
  # `flutter create`, and locally via `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.0

# The launcher artwork is generated by tool/generate_icons.py from the same
# geometry as lib/ui/logo.dart: a leaf with a terracotta check badge, on the
# brand green plate. Regenerate with `python tool/generate_icons.py`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#12301C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # The PNG already keeps the mark inside the 66% adaptive safe zone.
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  # No bundled image assets: the hero is a hand-painted CustomPainter scene
  # and the launcher icons are build-time only, so the APK stays lean.
