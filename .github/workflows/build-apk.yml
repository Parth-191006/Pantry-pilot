name: Build Android APK

# Builds a release APK on every push to main/master, plus on-demand from the
# Actions tab. The APK is uploaded as a downloadable artifact — no local
# Flutter install required.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # AGP 8 needs JDK 17
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The repo ships Dart sources only — this generates the android/ platform
      # folder (Gradle wrapper, manifest, icons) inside CI. Idempotent: skips
      # files that already exist.
      - name: Generate Android platform folder
        run: |
          flutter create . --platforms android --project-name pantry_pilot
          # create() drops in a placeholder widget_test.dart referencing a
          # MyApp class that doesn't exist in this project — remove it.
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      # Launcher icon + home-screen label. The icon is generated from the same
      # vector geometry the app paints in-app (tool/generate_icons.py), so the
      # two can never drift apart.
      - name: Brand the Android shell
        run: |
          dart run flutter_launcher_icons
          sed -i 's/android:label="[^"]*"/android:label="Recipe Pilot"/' \
            android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml
          ls android/app/src/main/res/mipmap-xxhdpi/

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      # Output goes to the run's Step Summary too, so failures are readable
      # on the public Actions page without signing in.
      - name: Run tests
        run: |
          flutter test --reporter expanded 2>&1 | tee test_output.log
          exit ${PIPESTATUS[0]}

      - name: Publish test results to summary
        if: always()
        run: |
          echo "## Flutter test results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 test_output.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Surface the failing test detail as an error annotation (readable via
      # the API without authentication).
      - name: Dump test failures to annotations
        if: failure()
        run: |
          TAIL=$(tail -80 test_output.log | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::TESTLOG::$TAIL"

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipe-pilot-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
